<title>Перехват эфира Владоса</title>
<style>
:root{
  color-scheme:dark;
  --void:#030907;--void2:#07130f;--phos:#e6fff4;--mut:#8fb3a8;--dim:#56776d;
  --pink:#ff2e88;--cyan:#1fe3ff;--tele:#ffd93b;--red:#ff3b2f;--grn:#43e27f;
  --k0:#ff4b3e;--k1:#43e27f;--k2:#ffd93b;--k3:#1fe3ff;--k4:#ff2e88;--k5:#e6fff4;
  --led:'Handjet','JetBrains Mono',ui-monospace,monospace;
  --sans:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --noise:none;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:#020605}
body{height:100%;margin:0;background:#020605;color:var(--phos);font:15px/1.4 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--tele);outline-offset:3px}
p,h1,h2,ol{margin:0}
img{max-width:none}
.hol{font-variation-settings:'ELSH' 5}
.dot{font-variation-settings:'ELSH' 14}
@keyframes blink{50%{opacity:0}}
@keyframes nz{0%{background-position:0 0}25%{background-position:-37px 21px}50%{background-position:18px -44px}75%{background-position:-55px -13px}}

#gl{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}

/* ---------- control strip ---------- */
.bar{flex:none;display:flex;align-items:center;gap:10px 12px;min-height:54px;padding-block:max(8px,env(safe-area-inset-top)) 8px;border-bottom:1px solid rgba(230,255,244,.08)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;margin-right:auto}
.onair{display:inline-flex;align-items:center;gap:7px;background:var(--red);color:#fff;font:700 17px/1 var(--led);letter-spacing:.12em;padding:5px 8px 4px}
.onair i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s steps(1) infinite}
.chan{font:800 21px/1 var(--led);letter-spacing:.05em;text-shadow:-1.5px 0 var(--pink),1.5px 0 var(--cyan)}
.chan small{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--mut);margin-left:8px;text-shadow:none}
.chips{display:flex;gap:4px}
.chip{position:relative;background:rgba(3,9,7,.7);border:1px solid rgba(230,255,244,.16);color:#a9c9bf;font:500 12px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;padding:9px 12px;overflow:hidden;white-space:nowrap}
.chip:hover{color:var(--phos);border-color:rgba(230,255,244,.42)}
.chip[aria-current="true"]{background:var(--phos);color:#030907;border-color:var(--phos)}
.chip .pg{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--pink);transform-origin:0 50%;transform:scaleX(0)}
.ctl{display:flex;gap:6px;align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:8px;background:rgba(3,9,7,.7);border:1px solid rgba(230,255,244,.16);font:500 12px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;padding:8px 11px;white-space:nowrap}
.tbtn:hover{border-color:rgba(230,255,244,.42)}
.tbtn svg{width:11px;height:11px;fill:currentColor;flex:none}
.tbtn[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.eq i{width:2px;height:3px;background:currentColor}
.tbtn[aria-pressed="true"] .eq i{animation:eq .5s steps(3) infinite alternate}
.eq i:nth-child(2){animation-delay:-.2s!important}.eq i:nth-child(3){animation-delay:-.35s!important}
@keyframes eq{to{height:11px}}
.vsw{display:none;border:1px solid rgba(230,255,244,.16)}
.vsw button{background:transparent;border:0;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:9px 10px;color:#a9c9bf}
.vsw button[aria-pressed="true"]{background:var(--cyan);color:#030907}

/* ---------- stage ---------- */
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:32px;padding-block:10px 12px}
.dev{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}
.dev figcaption{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#6d9187;display:flex;gap:8px;align-items:center;white-space:nowrap}
.dev figcaption i{width:6px;height:6px;background:var(--red);border-radius:50%;box-shadow:0 0 6px var(--red)}
.tv-frame{position:relative;border:12px solid #08110e;border-radius:26px;box-shadow:0 0 0 1px rgba(230,255,244,.1),0 0 0 3px #010302,0 40px 90px -24px rgba(0,0,0,.95)}
.tv-frame::after{content:"";position:absolute;right:4px;bottom:-8px;width:4px;height:4px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red)}
.screen{position:relative;overflow:hidden}
.tv-screen{border-radius:14px;width:800px;height:450px}
.tvc{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.tvw{position:absolute;inset:0}
.ph-frame{border:9px solid #0c1512;border-radius:calc(54px * var(--ps,1));box-shadow:0 0 0 1px #1f2e29,0 40px 90px -24px rgba(0,0,0,.95)}
.ph-screen{border-radius:calc(54px * var(--ps,1) - 9px);width:390px;height:844px}
.phc{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;container-type:size}
.phw{position:absolute;inset:0;display:flex;flex-direction:column}
.no-gl .tv-screen,.no-gl .ph-screen{background:radial-gradient(ellipse at 50% 42%,#0c2c24,#030907 72%)}
.no-gl .screen::before{content:"";position:absolute;inset:0;z-index:5;background:#0a1512 var(--noise);background-size:96px;animation:nz .2s steps(1) infinite;opacity:0;pointer-events:none}
.no-gl.sw .screen::before{opacity:1}

/* screen overlays */
.fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.fx .scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.3) 0 1px,rgba(0,0,0,0) 1px 3px)}
.fx .vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 80% at 50% 50%,transparent 58%,rgba(0,0,0,.5) 100%)}
.fx .roll{position:absolute;left:0;right:0;top:-16%;height:16%;background:linear-gradient(to bottom,transparent,rgba(230,255,244,.045) 55%,transparent);animation:roll 8s linear infinite}
@keyframes roll{to{transform:translateY(760%)}}
.fx .blk{position:absolute;display:none;mix-blend-mode:difference}
#phFx .scan{opacity:.45}
#phFx .vig{opacity:.5}

/* ---------- TV (1600x900 logical) ---------- */
.tvw{font-family:var(--sans);color:var(--phos)}
.t-hdr{position:absolute;left:56px;right:56px;top:28px;height:54px;display:flex;align-items:center;gap:22px;z-index:3}
.t-live{display:flex;align-items:center;gap:12px;background:var(--red);color:#fff;font:700 32px/1 var(--led);letter-spacing:.14em;padding:10px 16px 8px}
.t-live i{width:13px;height:13px;border-radius:50%;background:#fff;animation:blink 1s steps(1) infinite}
.t-logo{font:800 40px/1 var(--led);letter-spacing:.05em;text-shadow:-3px 0 var(--pink),3px 0 var(--cyan)}
.t-logo small{font:500 17px/1 var(--mono);letter-spacing:.24em;color:var(--mut);margin-left:16px;text-shadow:none;vertical-align:middle}
.t-tc{margin-left:auto;display:flex;gap:18px;align-items:baseline;font:500 36px/1 var(--led);color:var(--tele);letter-spacing:.06em}
.t-tc span:first-child{color:var(--mut);font-size:26px}
.t-tick{position:absolute;left:0;right:0;bottom:0;height:68px;display:flex;background:rgba(0,0,0,.84);border-top:3px solid var(--tele);z-index:3}
.t-tick b{flex:none;background:var(--tele);color:#030907;font:800 34px/65px var(--led);letter-spacing:.16em;padding:0 24px}
.t-crawl{flex:1;overflow:hidden;position:relative}
.t-crawl div{position:absolute;left:0;top:0;white-space:nowrap;font:500 27px/65px var(--mono);color:var(--tele);letter-spacing:.03em;animation:crawl 30s linear infinite;will-change:transform}
@keyframes crawl{to{transform:translateX(-50%)}}
.hurry .t-tick{border-color:var(--red)}
.hurry .t-tick b{background:var(--red);color:#fff}
.hurry .t-crawl div{color:#ff8a80}
.t-sc{position:absolute;left:56px;right:56px;top:104px;bottom:90px}
.t-fly,.t-rx{position:absolute;inset:0;pointer-events:none;z-index:4}
.fly{position:absolute;left:0;top:0;width:88px;height:88px;image-rendering:pixelated;filter:drop-shadow(-7px 0 0 rgba(255,46,136,.75)) drop-shadow(7px 0 0 rgba(31,227,255,.75))}
.fly.sm{width:32px;height:32px;filter:drop-shadow(-3px 0 0 rgba(255,46,136,.8)) drop-shadow(3px 0 0 rgba(31,227,255,.8))}
.rx{position:absolute;left:0;top:0;font-size:72px;line-height:1;text-shadow:-5px 0 rgba(255,46,136,.65),5px 0 rgba(31,227,255,.65)}
.rx.me{font-size:104px}
.rx small{position:absolute;left:50%;top:100%;transform:translateX(-50%);font:700 26px/1 var(--led);letter-spacing:.08em;background:var(--pink);color:#fff;padding:5px 8px 3px;white-space:nowrap;text-shadow:none}
.t-osd{position:absolute;right:56px;top:98px;z-index:8;display:none;flex-direction:column;align-items:flex-end;font:600 96px/.9 var(--led);color:#b6ffd6;text-shadow:4px 4px 0 #000;letter-spacing:.04em;background:rgba(2,6,5,.9);padding:16px 22px 12px;box-shadow:0 0 0 3px rgba(182,255,214,.3)}
.t-osd span{font-size:44px;letter-spacing:.2em}
.t-flash{position:absolute;inset:0;z-index:6;background:#e6fff4;opacity:0;pointer-events:none}
/* lobby: "новый зритель" takeover */
.t-me-dim{position:absolute;left:0;right:0;top:82px;bottom:68px;z-index:2;background:repeating-linear-gradient(to bottom,rgba(2,6,5,.92) 0 3px,rgba(2,6,5,.78) 3px 6px);opacity:0;pointer-events:none}
.t-me{position:absolute;inset:0;z-index:5;pointer-events:none;display:none}
.t-me-rib{position:absolute;left:0;right:0;top:104px;height:58px;background:var(--red);color:#fff;overflow:hidden;transform-origin:0 50%}
.t-me-rib span{position:absolute;left:0;top:0;white-space:nowrap;font:700 36px/60px var(--led);letter-spacing:.22em;animation:crawl 6s linear infinite}
.t-me-pic{position:absolute;left:0;top:0;width:400px;height:400px;transform-origin:0 0}
.t-me-pic canvas{display:block;width:100%;height:100%;image-rendering:pixelated;box-shadow:-12px 0 0 rgba(255,46,136,.85),12px 0 0 rgba(31,227,255,.85),0 0 0 6px #030907}
.t-me-pic i{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 2px,transparent 2px 5px)}
.t-me-tx{position:absolute;left:760px;top:224px;width:790px;display:flex;flex-direction:column;align-items:flex-start;gap:30px}
.t-me-k{font:700 40px/1 var(--led);letter-spacing:.2em;color:var(--tele)}
.t-me-n{font:600 210px/.84 var(--led);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;text-shadow:-8px 0 var(--pink),8px 0 var(--cyan)}
.t-me-s{font:500 26px/1.3 var(--mono);color:var(--mut);letter-spacing:.04em}
.t-me-s b{color:var(--phos);font-weight:600}
/* reveal: pixel-sort drip + signal lock lines */
.q-ps{position:absolute;left:0;top:0;width:1488px;height:706px;z-index:2;pointer-events:none;image-rendering:pixelated;mix-blend-mode:screen}
.q-lkl{position:absolute;left:-56px;right:-56px;top:0;height:5px;z-index:3;background:var(--tele);box-shadow:0 0 24px 4px rgba(255,217,59,.7);opacity:0;pointer-events:none}

/* scene 0 — ident */
.s0-bars{position:absolute;left:0;right:0;top:0;height:14px;display:flex}
.s0-bars i{flex:1}
.s0-title{position:absolute;left:-4px;top:44px;margin:0;font:800 170px/.84 var(--led);text-transform:uppercase;letter-spacing:.01em}
.s0-title .ln{display:block;white-space:nowrap}
.s0-title .ln.acc{font-size:300px;line-height:.82;font-weight:900;text-shadow:-8px 0 var(--pink),8px 0 var(--cyan)}
.nz{color:var(--cyan)}
.gh{opacity:0}
.s0-sub{position:absolute;left:0;top:600px;width:820px;font:500 27px/1.35 var(--sans);color:#cfe9df;text-wrap:balance}
.s0-side{position:absolute;right:0;top:64px;width:440px;display:flex;flex-direction:column;gap:30px}
.s0-when{font:600 30px/1 var(--mono);letter-spacing:.14em;color:var(--mut);display:flex;flex-direction:column;gap:10px}
.s0-when b{font:600 150px/.8 var(--led);color:var(--tele);letter-spacing:.02em}
.s0-qr{display:flex;gap:22px;align-items:center}
.s0-qr canvas{width:176px;height:176px;image-rendering:pixelated;flex:none}
.s0-qr p{font:500 22px/1.35 var(--sans);color:#cfe9df}
.s0-qr p span{display:block;margin-top:10px;font:600 30px/1.1 var(--led);color:var(--phos);letter-spacing:.02em}
.s0-n{font:500 28px/1 var(--mono);color:var(--mut);letter-spacing:.06em}
.s0-n b{font:600 64px/1 var(--led);color:var(--phos);margin-right:10px}

/* scene 1 — lobby */
.s1-l{position:absolute;left:0;top:0;width:450px}
.s1-lbl{font:700 34px/1 var(--led);letter-spacing:.1em;color:var(--tele);margin-bottom:26px}
.s1-qr{position:relative;width:440px;height:440px}
.s1-qr canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.ck{position:absolute;width:40px;height:40px;border:5px solid var(--cyan)}
.ck.a{left:-16px;top:-16px;border-right:0;border-bottom:0}.ck.b{right:-16px;top:-16px;border-left:0;border-bottom:0}
.ck.c{left:-16px;bottom:-16px;border-right:0;border-top:0}.ck.d{right:-16px;bottom:-16px;border-left:0;border-top:0}
.s1-link{margin-top:30px;font:700 47px/1 var(--led);letter-spacing:.01em;white-space:nowrap}
.s1-hint{margin-top:12px;font:500 22px/1 var(--mono);color:var(--mut)}
.s1-r{position:absolute;right:0;top:0;width:934px}
.s1-hd{display:flex;align-items:flex-end;gap:22px;height:118px;margin-bottom:12px}
.s1-hd b{font:600 150px/.78 var(--led);color:var(--phos);text-shadow:-5px 0 var(--pink),5px 0 var(--cyan);min-width:170px;letter-spacing:.02em}
.s1-hd span{font:600 38px/1 var(--led);letter-spacing:.06em;padding-bottom:6px}
.s1-hd em{font:500 22px/1.3 var(--mono);color:var(--mut);font-style:normal;letter-spacing:0}
.s1-st{margin-left:auto;background:var(--tele);color:#030907;padding:10px 14px 7px!important;font-size:30px!important;align-self:center}
.wall{display:grid;grid-template-columns:repeat(10,88px);grid-auto-rows:88px;gap:6px}
.tile{position:relative;background:#06100d var(--noise);background-size:96px;animation:nz .5s steps(1) infinite;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0;background:rgba(3,9,7,.72)}
.tile img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;visibility:hidden}
.tile b{position:absolute;left:0;right:0;bottom:0;font:700 17px/1 var(--led);letter-spacing:.04em;background:rgba(3,9,7,.82);padding:3px 5px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;visibility:hidden}
.tile.on{animation:none}
.tile.on img,.tile.on b{visibility:visible}
.tile.me{outline:3px solid var(--pink);outline-offset:-3px}
.tile.me b{background:var(--pink);color:#fff}
.tile.vl{outline:3px solid var(--tele);outline-offset:-3px}
.tile.vl b{background:var(--tele);color:#030907}
.tile .cr{position:absolute;right:4px;top:4px;width:30px;height:20px;z-index:2}
.tile.hit::after{content:"";position:absolute;inset:0;background:#fff;animation:hit .45s steps(4) forwards;z-index:3}
@keyframes hit{0%{opacity:1}40%{opacity:.6;background:var(--cyan)}100%{opacity:0}}
.s1-log{margin-top:16px;font:500 22px/1.3 var(--mono);color:var(--cyan);white-space:nowrap;overflow:hidden}

/* scene 2/3 — question */
.q-hd{position:absolute;left:0;top:0;height:46px;display:flex;align-items:center;gap:18px}
.q-no{font:700 38px/1 var(--led);letter-spacing:.08em}
.q-x2{background:var(--tele);color:#030907;font:800 32px/1 var(--led);letter-spacing:.1em;padding:8px 12px 6px;display:inline-block}
.q-ex{font:500 19px/1 var(--mono);color:var(--dim);letter-spacing:.08em;border:1px dashed var(--dim);padding:6px 9px}
.q-tx{position:absolute;left:0;top:64px;width:1030px;font:600 88px/.98 var(--led);letter-spacing:.005em;text-wrap:balance}
.cur{display:inline-block;width:.42em;height:.8em;background:var(--cyan);vertical-align:-.04em;margin-left:.04em;animation:blink .5s steps(1) infinite}
.q-tm{position:absolute;right:0;top:0;width:380px;height:252px;border:3px solid rgba(230,255,244,.8);padding:14px 20px 12px;display:flex;flex-direction:column;background:rgba(3,9,7,.55)}
.q-tl{font:600 20px/1 var(--mono);letter-spacing:.12em;color:var(--mut)}
.q-dg{position:relative;flex:1;display:flex;align-items:center;justify-content:flex-end}
.q-gh,.q-d{font:600 190px/1 var(--led);letter-spacing:.02em}
.q-gh{position:absolute;right:0;opacity:.07;font-variation-settings:'ELSH' 14}
.q-d{position:relative;white-space:nowrap}
.q-d i{font-style:normal}
.q-d i.br{font-variation-settings:'ELSH' 14;opacity:.55}
.q-bar{height:8px;background:rgba(230,255,244,.12)}
.q-bar i{display:block;height:100%;width:100%;background:var(--phos);transform-origin:0 50%}
.q-sp{margin-top:8px;font:500 15px/1 var(--mono);color:var(--dim);letter-spacing:.06em;text-align:right}
.hurry .q-tm{border-color:var(--red);box-shadow:0 0 40px rgba(255,59,47,.35),inset 0 0 30px rgba(255,59,47,.18)}
.hurry .q-d{color:var(--red);text-shadow:0 0 24px rgba(255,59,47,.6)}
.hurry .q-bar i{background:var(--red)}
.hurry .q-tl{color:#ff8a80}
.q-tm.ans .q-d{color:var(--tele)}
.q-op{position:absolute;left:0;right:0;top:274px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:150px;gap:16px}
.opt{position:relative;--k:var(--k0)}
.opt-bg{position:absolute;inset:0;clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px));background:color-mix(in srgb,var(--k) 70%,transparent)}
.opt-bg::after{content:"";position:absolute;inset:3px;clip-path:polygon(0 0,calc(100% - 25px) 0,100% 25px,100% 100%,25px 100%,0 calc(100% - 25px));background:linear-gradient(100deg,color-mix(in srgb,var(--k) 22%,rgba(3,9,7,.8)) 0%,rgba(3,9,7,.78) 55%),repeating-linear-gradient(to bottom,rgba(230,255,244,.06) 0 2px,transparent 2px 5px)}
.opt-fill{position:absolute;inset:3px;clip-path:polygon(0 0,calc(100% - 25px) 0,100% 25px,100% 100%,25px 100%,0 calc(100% - 25px));background:var(--tele);transform:scaleX(0);transform-origin:0 50%}
.opt-sh{position:absolute;inset:0;overflow:hidden;clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px));pointer-events:none}
.opt-sh::after{content:"";position:absolute;top:0;bottom:0;width:120px;left:-160px;background:linear-gradient(90deg,transparent,rgba(230,255,244,.14),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes shine{0%,60%{left:-160px}100%{left:110%}}
.opt-k{position:absolute;left:0;top:0;bottom:0;width:104px;display:grid;place-items:center;background:var(--k);color:#030907;font:900 84px/1 var(--led);clip-path:polygon(0 0,100% 0,100% 100%,26px 100%,0 calc(100% - 26px))}
.opt-t{position:absolute;left:132px;right:150px;top:0;bottom:0;display:flex;align-items:center;font:600 36px/1.12 var(--sans);letter-spacing:-.005em;text-wrap:balance}
.opt-r{position:absolute;right:26px;top:0;bottom:0;display:flex;align-items:center;gap:10px}
.opt-av{display:flex;flex-direction:row-reverse}
.opt-av img{width:34px;height:34px;image-rendering:pixelated;margin-left:-12px;box-shadow:0 0 0 2px #030907}
.opt-n{font:600 70px/1 var(--led);min-width:60px;text-align:right;visibility:hidden}
.opt.shown .opt-n{visibility:visible}
.opt-lk{position:absolute;inset:-14px;pointer-events:none;opacity:0}
.opt-lk i{position:absolute;width:44px;height:44px;border:6px solid var(--tele)}
.opt-lk i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.opt-lk i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.opt-lk i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.opt-lk i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}

  var P={hx:16+(r()-.5)*2.4,hy:14.5+(r()-.5)*1.6,hw:6.4+r()*1.8,hh:8+r()*1.4,hair:(r()*6)|0,gl:r()<.24,skin:.62+r()*.26,bg:.02+r()*.08,shirt:.3+r()*.3,tilt:(r()-.5)*.22,hairL:r()<.22?.78:.08,beard:r()<.16};
  var L=new Float32Array(1024);

    var v=P.bg+(1-y/32)*.05;
    var sx=(x-16)/13.5,sy=(y-33.5)/10.5;
    if(sx*sx+sy*sy<1)v=P.shirt+(x<16?.1:-.04)-(Math.abs(x-16)<2&&y>26?.15:0);
    if(Math.abs(x-P.hx)<3.2&&y>P.hy+5&&y<27)v=P.skin*.66;
    var dx=(x-P.hx)-(y-P.hy)*P.tilt,dy=y-P.hy,e=(dx/P.hw)*(dx/P.hw)+(dy/P.hh)*(dy/P.hh);
    var hair=false;

      case 1:hair=(e<1.3&&dy<-P.hh*.3)||(Math.abs(dx)>P.hw*.72&&Math.abs(dx)<P.hw*1.38&&dy>-P.hh*.5&&dy<P.hh*1.3);break;
      case 2:hair=(e<1.18&&dy<-P.hh*.42)||((x-P.hx)*(x-P.hx)+(y-(P.hy-P.hh-1.8))*(y-(P.hy-P.hh-1.8))<9);break;
      case 3:hair=e<1.28&&dy<-P.hh*.26;break;
      case 4:hair=e<1.38&&dy<-P.hh*.16&&((x*3+y*5)%5<3);break;
      default:hair=e<1.06&&dy<-P.hh*.55;
    }
    if(e<1){
      v=P.skin-.22*(dx/P.hw)-.1*e;
      var ey=-.6;
      for(var s=-1;s<=1;s+=2){var ex=dx-s*2.8,dd=Math.sqrt(ex*ex+(dy-ey)*(dy-ey));if(dd<1.05)v=.05;if(P.gl&&dd>1.6&&dd<2.5)v=.1}
      if(P.gl&&Math.abs(dx)<1&&Math.abs(dy-ey)<.6)v=.1;
      if(dx>-.6&&dx<.9&&dy>.6&&dy<2.6)v-=.12;
      if(Math.abs(dy-(3.9+dx*dx*.06))<.6&&Math.abs(dx)<2.3)v=.22;
      if(P.beard&&dy>2.2&&e>.3)v=.14;
    }

    if(P.hair===3&&dy>-P.hh*.36&&dy<-P.hh*.14&&dx>-P.hw&&dx<P.hw*1.7&&e>.5)v=.86;
    L[y*32+x]=clamp(v,0,1);
  }

}

  crowdReacts(lockT+.4,8.5,.55);

  t1.call(function(){lb.hidden=true;pod.hidden=false;$$('.pc',pod).forEach(function(c){G.set(c,{opacity:0})})},null,PT+.15);
  [3,2,1].forEach(function(r,k){

});

/* ================= main loop ================= */
var raf=0,last=performance.now(),clockEl=$('#tClock');
function frame(now){
  raf=requestAnimationFrame(frame);
  var dt=Math.min(.1,(now-last)/1000);last=now;
  S.t+=dt;S.clock+=dt;
  if(S.scene>=0){
    var pg=chips[S.scene].querySelector('.pg');pg.style.transform='scaleX('+clamp(S.t/DUR[S.scene],0,1)+')';
    if(S.auto&&S.t>DUR[S.scene])go((S.scene+1)%5);
  }
  if(S.scene===2)qTick(now);
  fxTick(now);vfTick(now);if(PS.items.length)psDraw();
  var c=Math.floor(S.clock),hh=Math.floor(c/3600)%24,mm=Math.floor(c/60)%60,ss=c%60;
  var cs=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');if(clockEl.textContent!==cs)clockEl.textContent=cs;
  glDraw(now);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){cancelAnimationFrame(raf);raf=0;G.globalTimeline.pause();if(AU.ctx&&AU.on)AU.ctx.suspend()}
  else{last=performance.now();G.globalTimeline.resume();if(AU.ctx&&AU.on)AU.ctx.resume();if(!raf)raf=requestAnimationFrame(frame)}
});

/* ================= boot ================= */
updMe();setAuto(true);setTicker(0);
drawQR($('#qrS'),29);drawQR($('#qrB'),29);
layout();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){layout()});

go(0);
raf=requestAnimationFrame(frame);
})();
