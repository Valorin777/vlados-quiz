<title>Жидкий хром</title>
<style>
:root{color-scheme:dark;
--ink:#0E1015;--ground:#13161C;--graphite:#1B1F26;--line:#262A33;--steel:#8A919C;--mercury:#C9CFD8;--spec:#F4F6F9;--engrave:#13151A;
--film-c:#6FE3D8;--film-m:#DE6CCB;--film-g:#EFB860;--bronze:#C99A62;
--fd:"Unbounded","Arial Black",system-ui,sans-serif;--fb:"Geologica","Segoe UI",system-ui,-apple-system,sans-serif;--fm:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
--chrome:linear-gradient(180deg,#FDFEFF 0%,#D9DEE5 24%,#A1A9B4 43%,#3A3F49 50%,#626A76 57%,#BCC3CC 73%,#EEF1F5 88%,#FFFFFF 100%);
--emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
html{height:100%;box-sizing:border-box;background:var(--ink)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#161920 0%,var(--ink) 70%) var(--ink);color:var(--mercury);font:400 15px/1.4 var(--fb);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--film-c);outline-offset:3px}
.app{position:relative;height:100%;display:flex;flex-direction:column;padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px))}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* ---------- control strip ---------- */
.strip{position:relative;z-index:3;display:flex;align-items:center;gap:14px 18px;padding-block:max(10px,env(safe-area-inset-top,0px)) 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:600 11px/1 var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--steel);white-space:nowrap}
.brand i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff 0 8%,#D5DAE1 20%,#7E8691 48%,#23272E 60%,#A9B0BA 78%,#F1F3F6 92%)}
.chips{display:flex;gap:2px;margin-inline:auto;padding:3px;border:1px solid var(--line);border-radius:999px;background:rgba(10,12,16,.6)}
.chip{position:relative;appearance:none;border:0;background:transparent;color:var(--steel);font:500 13px/1 var(--fb);padding:9px 15px 10px;border-radius:999px;cursor:pointer;transition:color .3s}
.chip:hover{color:var(--spec)}
.chip[aria-current="step"]{color:var(--engrave);background:var(--chrome);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.chip b{position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:2px;background:rgba(19,21,26,.45);transform-origin:0 50%;transform:scaleX(0)}
.chip:not([aria-current="step"]) b{display:none}
.ctl{display:flex;align-items:center;gap:8px}
.ib,.tb,.seg button{appearance:none;border:1px solid var(--line);background:rgba(10,12,16,.6);color:var(--mercury);height:34px;border-radius:999px;cursor:pointer;font:500 13px/1 var(--fb)}
.ib{width:34px;display:grid;place-items:center;padding:0}
.ib svg{width:14px;height:14px;fill:currentColor}
.ib .i-pl{display:none}.ib[aria-pressed="false"] .i-pa{display:none}.ib[aria-pressed="false"] .i-pl{display:block}
.tb{padding:0 14px;display:flex;align-items:center;gap:8px}
.tb i{width:7px;height:7px;border-radius:50%;background:#3A3F48;transition:background .3s,box-shadow .3s}
.tb[aria-pressed="true"] i{background:var(--film-c);box-shadow:0 0 10px var(--film-c)}
.seg{display:none;border:1px solid var(--line);border-radius:999px;padding:2px;background:rgba(10,12,16,.6)}
.seg button{border:0;height:28px;padding:0 12px;background:transparent;color:var(--steel)}
.seg button[aria-pressed="true"]{background:var(--chrome);color:var(--engrave)}

/* ---------- stage ---------- */
.stage{position:relative;z-index:1;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:var(--gap,40px);padding-block:18px}
.dev{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.dev figcaption{font:500 10.5px/1 var(--fm);letter-spacing:.18em;text-transform:uppercase;color:#6B727D}
.tvbox{position:relative;width:640px;height:360px;border-radius:calc(18px*var(--s,.5));box-shadow:0 0 0 1px #2B3039,0 0 0 8px #090A0D,0 0 0 9px #3B414B,0 0 0 10px #0B0C0F,0 50px 90px -40px rgba(0,0,0,.9)}
.phbox{position:relative;width:195px;height:422px;border-radius:calc(54px*var(--ps,.5))}
.phbox::before{content:"";position:absolute;inset:calc(-11px*var(--ps,.5));border-radius:calc(65px*var(--ps,.5));padding:calc(11px*var(--ps,.5));background:linear-gradient(140deg,#F4F6F9 0%,#8B929D 18%,#1C1F25 34%,#CDD3DA 52%,#555C67 70%,#F0F2F5 86%,#7C838E 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.phbox::after{content:"";position:absolute;inset:-2px;border-radius:calc(56px*var(--ps,.5));box-shadow:0 0 0 2px #07080A;pointer-events:none}
.tv{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;transform:scale(.5);overflow:hidden;border-radius:18px;color:var(--mercury)}
.ph{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;transform:scale(.5);overflow:hidden;border-radius:54px;container-type:size;color:var(--mercury)}
.nogl .tv,.nogl .ph{background:radial-gradient(90% 80% at 50% 35%,#1E222A,#101217)}

/* narrow: phone full-bleed, optional TV */
.narrow{padding-inline:0}
.narrow .strip{padding-inline:16px;gap:10px}
.narrow .brand{display:none}
.narrow .chips{margin-inline:0;flex:1 1 100%;justify-content:space-between}
.narrow .chip{padding:9px 4px 10px;font-size:clamp(11.5px,3.4vw,13px);flex:1 1 0;min-width:0}
.narrow .chip b{left:10px;right:10px}
.narrow .ctl{flex:1 1 100%;justify-content:space-between}
@media (orientation:landscape) and (min-width:640px){.narrow .chips{flex:1 1 auto}.narrow .ctl{flex:0 0 auto;gap:8px}}
.narrow .seg{display:flex}
.narrow .stage{padding:0;gap:0}
.narrow .dev figcaption{display:none}
.narrow .dev-ph{position:absolute;inset:0}
.narrow .phbox{position:absolute;inset:0;width:auto!important;height:auto!important;border-radius:0}
.narrow .phbox::before,.narrow .phbox::after{display:none}
.narrow .ph{inset:0;width:auto!important;height:auto!important;transform:none!important;border-radius:0}
.narrow.v-tv .dev-ph{display:none}
.narrow:not(.v-tv) .dev-tv{display:none}
.narrow.v-tv .stage{padding:16px}

/* ---------- shared type ---------- */
.chr{color:#D6DBE2;background-image:linear-gradient(104deg,transparent 0 41%,rgba(255,255,255,.95) 46.5%,rgba(111,227,216,.9) 48.6%,rgba(222,108,203,.8) 50.4%,rgba(239,184,96,.7) 52%,transparent 57% 100%),var(--chrome);background-size:260% 100%,100% 100%;background-repeat:no-repeat;background-position:115% 0,0 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sweep 6.5s cubic-bezier(.62,0,.28,1) infinite}
@keyframes sweep{0%{background-position:115% 0,0 0}55%,100%{background-position:-15% 0,0 0}}
.eng{color:var(--engrave);text-shadow:0 1px 0 rgba(255,255,255,.5),0 -1px 0 rgba(0,0,0,.16)}
.kick{margin:0;font:600 11px/1.2 var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.06em .04em .1em;margin:-.06em -.04em -.1em}
.wi,.ch{display:inline-block;transform-origin:50% 100%}
.ch{animation-delay:calc(var(--i,0)*.07s)}

/* ---------- TV ---------- */
.L{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s linear .45s}
.L.on{opacity:1;visibility:visible;transition:opacity .45s}
.ab{position:absolute;left:0;top:0}
.t-kick{left:66px;top:50px;font:300 30px/1 var(--fb);color:var(--mercury);letter-spacing:.01em}
.t-hero{left:58px;top:86px;font:900 116px/1 var(--fd);letter-spacing:-.01em;white-space:nowrap}
.t-meta{left:auto;right:64px;top:44px;font:500 13px/1 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
.qr{left:79px;top:251px;width:270px;height:270px}
.qr svg{display:block;width:100%;height:100%}
.lnk{left:64px;top:562px;font:600 21px/1 var(--fm);color:var(--spec);letter-spacing:.01em}
.lnk2{left:64px;top:596px;font:400 17px/1 var(--fb);color:var(--steel)}
.cnt{left:404px;top:258px}
.cnt .kick{font-size:13px}
.cnt-n{display:flex;font:900 132px/1.1 var(--fd);margin-top:10px;height:1.1em}
.cnt-of{margin-top:6px;font:400 17px/1.3 var(--fb);color:var(--steel)}
.odo{display:inline-flex}
.odo .dg{display:inline-block;height:1.1em;overflow:hidden}
.odo .st{display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.3,1.45,.5,1)}
.odo .st span{display:block;height:1.1em;line-height:1.1em;text-align:center}
.tick{left:auto;right:64px;top:664px;font:500 17px/1 var(--fb);color:var(--mercury);text-align:right}
.tick b{font-weight:700;color:var(--spec)}
.tick i{font-style:normal;color:var(--steel)}
/* question */
.q-top{left:64px;top:34px;display:flex;align-items:center;gap:14px;height:28px}
.q-top .kick{font-size:13px}
.x2t{left:0;top:0;width:76px;height:34px;display:grid;place-items:center;font:900 17px/1 var(--fd)}
.q-x2l{left:342px;top:43px;font:500 13px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--film-g)}
.q-title{left:64px;top:86px;width:1000px;margin:0;font:700 50px/1.1 var(--fd);letter-spacing:-.01em;text-wrap:balance}
.opt{width:440px;height:104px;display:flex;align-items:center;justify-content:center;padding:0 30px;text-align:center}
.ot{display:block;font:650 22px/1.15 var(--fb);letter-spacing:-.005em;white-space:nowrap}
.oc{position:absolute;right:26px;top:50%;margin-top:-14px;font:700 22px/28px var(--fm);opacity:0}
.tube{left:0;top:0;width:1280px;height:720px;pointer-events:none}
.sec{left:auto;right:152px;top:0;font:600 50px/1 var(--fm);color:var(--spec);text-align:right;font-variant-numeric:tabular-nums;transform-origin:100% 50%}
.sec i{display:inline-block;font-style:normal;transform-origin:100% 50%}
.sec.hot{color:var(--film-g);text-shadow:0 0 24px rgba(239,184,96,.55)}
.ans{left:64px;top:540px;display:flex;align-items:baseline;gap:10px;font:400 18px/1 var(--fb);color:var(--steel)}
.ans b{font:700 30px/1 var(--fd);color:var(--spec);font-variant-numeric:tabular-nums}
.crown{left:0;top:0;width:120px}
.crown-i{display:flex;align-items:flex-end;gap:8px}
.crown svg{width:52px;height:38px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.crown span{font:600 13px/1 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--film-g);padding-bottom:4px}
.rv{left:64px;top:430px;width:900px}
.rv-1{margin:0;font:700 34px/1.1 var(--fd)}
.rv-2{margin:12px 0 0;font:400 21px/1.35 var(--fb);color:var(--mercury)}
.rv-2 b{color:var(--spec);font-weight:650}
.rv-v{left:64px;top:640px;margin:0;font:400 20px/1.3 var(--fb);color:var(--steel)}
.rv-v b{color:var(--film-g);font-weight:600}
/* final */
.f-title{left:64px;top:44px;margin:0;font:700 46px/1.05 var(--fd)}
.f-sub{left:66px;top:112px}
.row{position:absolute;left:0;top:0;width:1280px;height:44px}
.row>span{position:absolute;top:0;height:44px;display:flex;align-items:center}
.dl{left:58px;width:56px;justify-content:center;font:700 16px/1 var(--fm)}
.dl.up{color:var(--film-c)}.dl.dn{color:var(--bronze)}.dl.eq{color:#555C67}
.rk{left:122px;font:600 20px/1 var(--fm);color:var(--steel);font-variant-numeric:tabular-nums}
.nm{left:166px;font:600 25px/1 var(--fb);color:var(--spec);white-space:nowrap}
.row.me .nm{font:800 25px/1 var(--fd);color:var(--film-c)}
.scr{left:0;font:600 20px/1 var(--fm);color:var(--mercury);font-variant-numeric:tabular-nums}
.pd{position:absolute;left:0;top:0;width:220px;text-align:center}
.pd-n{display:block;font:900 64px/1 var(--fd)}
.pd-nm{display:block;margin-top:6px;font:700 22px/1.1 var(--fd);white-space:nowrap}
.pd-s{display:block;margin-top:6px;font:600 16px/1 var(--fm)}
.champ{left:0;top:0;width:360px;text-align:center;font:600 14px/1 var(--fm);letter-spacing:.18em;text-transform:uppercase;color:var(--film-g)}
.verdict{left:64px;top:44px;width:1150px}
.verdict .kick{font-size:13px;color:var(--film-g)}
.vd-1{margin:12px 0 0;font:700 40px/1.12 var(--fd);text-wrap:balance}
.vd-2{margin:10px 0 0;font:400 22px/1.35 var(--fb);color:var(--mercury)}
/* avatars + reactions */
.avs,.rx{position:absolute;inset:0;pointer-events:none}
.av{position:absolute;left:0;top:0;width:40px;height:40px;display:grid;place-items:center;visibility:hidden;will-change:transform}
.av b{font:800 17px/1 var(--fd);color:var(--engrave);text-shadow:0 1px 0 rgba(255,255,255,.55)}
.av img{width:31px;height:31px;border-radius:50%;display:block;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.re{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.re span{font:48px/1 var(--emoji)}
.re small{font:600 12px/1 var(--fm);color:var(--mercury);letter-spacing:.06em;padding:3px 7px;border-radius:99px;background:rgba(14,16,21,.7)}

/* ---------- phone ---------- */
.sb{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:4px 34px 0 40px;font:600 15px/1 var(--fb);color:var(--spec);z-index:6;pointer-events:none}
.sb .isl{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
.sb .bat{width:26px;height:12px;border-radius:4px;border:1.5px solid rgba(244,246,249,.55);padding:1.5px}
.sb .bat i{display:block;height:100%;width:72%;border-radius:2px;background:currentColor}
.ph.lightbg .sb{color:var(--engrave)}.ph.lightbg .sb .bat{border-color:rgba(19,21,26,.5)}
.narrow .sb{display:none}
.S{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s linear .35s}
.S.on{opacity:1;visibility:visible;transition:opacity .35s}
.pad{position:absolute;inset:0;display:flex;flex-direction:column;padding:64px 22px 30px}
.narrow .pad{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.step{opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s linear .3s}
.step.on{opacity:1;visibility:visible;transition:opacity .3s}
.j-title{margin:16px 0 0;display:flex;flex-direction:column}
.j-t1{font:300 26px/1.1 var(--fb);font-size:6.9cqw;color:var(--mercury)}
.j-hero{font:900 50px/1.02 var(--fd);font-size:13.1cqw;letter-spacing:-.015em;white-space:nowrap;margin-top:4px}
.puddle{height:16px;width:62%;margin-top:14px}
.j-note{margin:18px 0 0;max-width:30ch;font:400 15px/1.45 var(--fb);color:var(--steel)}
.j-form{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.lbl{font:500 14px/1.3 var(--fb);color:var(--mercury)}
.field{height:62px;border-radius:999px}
.field:focus-within{outline:2px solid var(--film-c);outline-offset:4px}
.field input{width:100%;height:100%;border:0;background:transparent;outline:0;border-radius:999px;text-align:center;font:700 21px/1 var(--fb);color:var(--engrave);caret-color:#0E1015;padding:0 26px}
.field input::placeholder{color:rgba(19,21,26,.42);font-weight:500}
.nogl .field,.nogl .sk,.nogl .btn:not(.ghost),.nogl .po,.nogl .x2,.nogl .pq-fill,.nogl .rb,.nogl .puddle,.nogl .orb,.nogl .f-block{background:linear-gradient(180deg,#F4F6F9,#C3C9D1 42%,#5E6672 51%,#CDD2D9 68%,#EEF1F4);border-radius:999px}
.nogl .f-block{border-radius:24px}
.nogl .opt,.nogl .x2t,.nogl .pd{background:linear-gradient(180deg,#F4F6F9,#C3C9D1 42%,#5E6672 51%,#CDD2D9 68%,#EEF1F4);border-radius:999px}
.nogl .pd{border-radius:22px;padding:14px 0}
.nogl .qr{background:#E9ECF0;border-radius:18px}
.nogl .me,.nogl .f-av,.nogl .vf,.nogl .pool{background:radial-gradient(circle at 38% 30%,#fff,#C6CCD4 30%,#4A515C 62%,#D5DAE0 85%);border-radius:50%}
.nogl .av{background:radial-gradient(circle at 38% 30%,#fff,#C6CCD4 30%,#4A515C 62%,#D5DAE0 85%);border-radius:50%}
.err{margin:-4px 0 0;min-height:1.2em;font:500 13px/1.2 var(--fb);color:var(--film-g)}
.btn{appearance:none;border:0;background:transparent;height:58px;border-radius:999px;font:700 17px/1 var(--fb);color:var(--engrave);text-shadow:0 1px 0 rgba(255,255,255,.5);cursor:pointer;padding:0 30px;-webkit-tap-highlight-color:transparent}
.btn.ghost{color:var(--mercury);text-shadow:none;font-weight:500;text-decoration:underline;text-decoration-color:rgba(201,207,216,.35);text-underline-offset:5px;padding:0 12px}
.h2{margin:10px 0 0;font:800 30px/1.08 var(--fd);font-size:7.8cqw}
.sub{margin:10px 0 0;font:400 15px/1.45 var(--fb);color:var(--steel);max-width:32ch}
.vf{position:relative;width:min(64cqw,40cqh,270px);aspect-ratio:1;max-width:100%;margin:26px auto 0;border-radius:50%}
.vf canvas{position:absolute;inset:6.5%;width:87%;height:87%;border-radius:50%;clip-path:circle(50% at 50% 50%)}
.vf .c{position:absolute;width:22px;height:22px;border:2px solid rgba(201,207,216,.55)}
.vf .tl{left:-16px;top:-16px;border-right:0;border-bottom:0}.vf .tr{right:-16px;top:-16px;border-left:0;border-bottom:0}
.vf .bl{left:-16px;bottom:-16px;border-right:0;border-top:0}.vf .br{right:-16px;bottom:-16px;border-left:0;border-top:0}
.vf-cap{margin:22px 0 0;text-align:center;font:500 15px/1.3 var(--fm);color:var(--mercury)}
.brow{margin-top:auto;display:flex;align-items:center;gap:10px}
.brow .btn:not(.ghost){flex:1}
/* lobby */
.l-hero{margin:14px 0 0;font:900 56px/0.98 var(--fd);font-size:14.2cqw;letter-spacing:-.02em}
.me-wrap{display:flex;align-items:center;gap:18px;margin-top:26px}
.me{position:relative;width:112px;height:112px;flex:none;border-radius:50%;display:grid;place-items:center}
.me img{width:88%;height:88%;border-radius:50%;display:block}
.me b{font:900 44px/1 var(--fd);color:var(--engrave)}
.me-name{margin:0;font:800 26px/1.1 var(--fd);color:var(--spec);word-break:break-word}
.me-st{margin:6px 0 0;font:500 13px/1.3 var(--fm);color:var(--steel)}
.l-sub{margin:22px 0 0;font:400 15px/1.45 var(--fb);color:var(--steel);max-width:32ch}
.l-mid{flex:1;min-height:0;display:grid;place-items:center;padding:12px 0}
.pool{position:relative;width:min(46cqw,26cqh,180px);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.pool b{font:900 46px/1 var(--fd);font-size:min(11.5cqw,46px);font-variant-numeric:tabular-nums}
.pool span{font:600 11px/1 var(--fm);letter-spacing:.14em;text-transform:uppercase}
.rx-wrap{margin-top:auto}
.rbar{display:flex;justify-content:space-between;margin-top:12px}
.rb{appearance:none;border:0;background:transparent;width:50px;height:50px;border-radius:50%;padding:0;display:grid;place-items:center;font:24px/1 var(--emoji);cursor:pointer;-webkit-tap-highlight-color:transparent}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.fx span{position:absolute;left:0;top:0;font:30px/1 var(--emoji)}
/* phone question */
.pq-top{display:flex;align-items:center;justify-content:space-between}
.x2{height:30px;padding:0 15px;border-radius:999px;display:grid;place-items:center;font:900 14px/1 var(--fd)}
.pq-timer{position:relative;margin-top:18px;height:14px;display:flex;align-items:center}
.pq-track{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(201,207,216,.18)}
.pq-fill{position:relative;width:100%;height:12px;border-radius:999px;transform-origin:0 50%}
.pq-row{display:flex;justify-content:space-between;margin-top:8px;font:500 12px/1 var(--fm);color:var(--steel)}
